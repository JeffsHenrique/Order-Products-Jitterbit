services:
  db:
    image: bitnami/postgresql
    restart: always
    ports:
      - 5432:5432
    environment:
      - POSTGRES_DB=order-products-jitterbit
      - POSTGRES_USER=docker
      - POSTGRES_PASSWORD=docker
    networks:
      - order-products-jitterbit-network
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docker -d order-products-jitterbit"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 3333:3333
    networks:
      - order-products-jitterbit-network
    volumes:
      - logs:/app/logs
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

networks:
  order-products-jitterbit-network:
    driver: bridge

volumes:
  db:
  logs: